# Alembic configuration. Run from backend/ so that .env resolves:
#
#     cd backend && uv run alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# No sqlalchemy.url here on purpose. alembic/env.py reads the URL from
# app.core.config.settings, so the database is configured in exactly one place
# (backend/.env) and `alembic upgrade head` can never target a different file
# than the API does.

[post_write_hooks]

# Logging configuration. This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
