[project]
name = "twitter-system"
version = "0.1.0"
description = "Twitter / Weibo system interview skeleton with production-style FastAPI structure"
readme = "../readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
    "redis>=6.4.0",
    "rq<=2.6.1", # https://github.com/rq/rq/issues/2369
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

# No [build-system]: this is a virtual project, so uv installs the dependencies
# but not the project itself. A [project.scripts] entry point would never be
# created in .venv/bin — run the worker with `python -m app.worker` instead.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
